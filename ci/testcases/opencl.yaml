# Test cases for `opencl`, drafted from regression.sh.in (review/collapse).
category: opencl
defaults:
  xlen:
  - 32
  - 64
  tier: smoke
  # 4-way sharding: the isa-1 make-run sweep (32 subtests) exceeded the
  # 6h per-job cap (run 36171371920: opencl-32 killed at exactly 360m
  # with the sweep still running, opencl-64 spent ~3h in isa-1 alone).
  # isa-1a..1d run per-test run-simx-<test> targets weighted by the
  # measured CI durations; every other case in this file is assigned
  # by a stable hash so no unsharded cell remains.
  shards: 4
tests:
- id: isa-1a
  via: make-run
  drivers:
  - simx
  dir: tests/opencl
  shards: {0: [isa-1a], 1: [isa-1b], 2: [isa-1c], 3: [isa-1d]}
  target: >-
    run-{driver}-nearn
    run-{driver}-guassian
    run-{driver}-nw
    run-{driver}-myocyte
    run-{driver}-heartwall
    run-{driver}-srad
    run-{driver}-hotspot3D
    run-{driver}-hotspot
    run-{driver}-dwt2d
    run-{driver}-backprop
- id: isa-1b
  via: make-run
  drivers:
  - simx
  dir: tests/opencl
  shards: {0: [isa-1a], 1: [isa-1b], 2: [isa-1c], 3: [isa-1d]}
  target: >-
    run-{driver}-streamcluster
    run-{driver}-cfd
    run-{driver}-lavaMD
    run-{driver}-btree
    run-{driver}-kmeans
    run-{driver}-spmv
    run-{driver}-stencil
    run-{driver}-psort
- id: isa-1c
  via: make-run
  drivers:
  - simx
  dir: tests/opencl
  shards: {0: [isa-1a], 1: [isa-1b], 2: [isa-1c], 3: [isa-1d]}
  target: >-
    run-{driver}-sgemm3
    run-{driver}-sgemm2
    run-{driver}-sgemm
    run-{driver}-saxpy
    run-{driver}-sfilter
    run-{driver}-psum
    run-{driver}-conv3
    run-{driver}-dotproduct
- id: isa-1d
  via: make-run
  drivers:
  - simx
  dir: tests/opencl
  shards: {0: [isa-1a], 1: [isa-1b], 2: [isa-1c], 3: [isa-1d]}
  target: >-
    run-{driver}-vecadd
    run-{driver}-oclprintf
    run-{driver}-bfs
    run-{driver}-pathfinder
    run-{driver}-blackscholes
    run-{driver}-lud
- id: isa-2
  via: make-run
  drivers:
  - rtlsim
  dir: tests/opencl
  target: run-{driver}
# hybridsort uses atomic_add (RVA amo*.w), so it needs the A extension and is
# excluded from the default run-{driver} sweep above. Runs on both simx and
# rtlsim (its bucket counters share one cache line, exercising the same-line
# scatter-atomic commit path).
- id: hybridsort
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: hybridsort
  xlen:
  - 32
  configs: "-DVX_CFG_EXT_A_ENABLE"
# OpenCL image feature tests. These require an image-enabled PoCL-Vortex build
# (CL_DEVICE_IMAGE_SUPPORT + the vortex scalar read/write_image builtins); point
# POCL_PATH at that build. Sampling runs in software (no fixed-function TEX), so
# no special device config is needed. Run on both simx and rtlsim.
- id: image-copy
  via: blackbox
  drivers: [simx, rtlsim]
  app: image_copy
- id: image-linear
  via: blackbox
  drivers: [simx, rtlsim]
  app: image_linear
- id: image-int
  via: blackbox
  drivers: [simx, rtlsim]
  app: image_int
- id: image-get
  via: blackbox
  drivers: [simx, rtlsim]
  app: image_get
# Tier-A image sampling: an FF-eligible read_imagef routed through the hardware
# TEX unit (vx_tex4). Needs VX_CFG_EXT_TEX_ENABLE; SimX serves the SETW/GETW
# graphics window via the RTU model, so RTU is enabled too (as gfx_tex4 does).
# The image_ff Makefile also sets these, so the app builds correctly either way;
# validated bit-exact vs the software sampler on both simx and rtlsim.
- id: image-ff
  via: blackbox
  drivers: [simx, rtlsim]
  app: image_ff
  configs: "-DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RTU_ENABLE -DVX_CFG_RTU_BVH_WIDTH=0"
# image-ff-linear: Tier-A bilinear (read_imagef LINEAR through vx_tex4); ~4.7x
# fewer instructions than the software blend. image-ff-bgra: the CL_BGRA swizzle
# branch of the FF path. image-hwsw: tier-equivalence — three identical images,
# the first two sampled by the two hardware TEX stages and the third overflowing
# to software, asserting hw==sw across nearest/linear x clamp/repeat/mirror
# (exercises both stages + the software fallback). All carry the TEX+RTU config.
- id: image-ff-linear
  via: blackbox
  drivers: [simx, rtlsim]
  app: image_ff_linear
  configs: "-DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RTU_ENABLE -DVX_CFG_RTU_BVH_WIDTH=0"
- id: image-ff-bgra
  via: blackbox
  drivers: [simx, rtlsim]
  app: image_ff_bgra
  configs: "-DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RTU_ENABLE -DVX_CFG_RTU_BVH_WIDTH=0"
- id: image-hwsw
  via: blackbox
  drivers: [simx, rtlsim]
  app: image_hwsw
  configs: "-DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RTU_ENABLE -DVX_CFG_RTU_BVH_WIDTH=0"
- id: lbm-1
  via: blackbox
  drivers:
  - simx
  app: lbm
  shape:
    warps: 8
- id: lbm-2
  via: blackbox
  drivers:
  - rtlsim
  app: lbm
  shape:
    warps: 8
