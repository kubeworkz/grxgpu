# Atomic (RISC-V 'A') extension tests. Transcribed from ci/regression.sh.in amo().
# The two standalone `make -C sim/{simx,rtlsim}` builds in the legacy function are
# not specs here — the sim build is derived per (driver, configs) build-key by the
# pytest sim_build fixture and shared across every spec that needs it.
category: amo
defaults:
  configs: "-DVX_CFG_EXT_A_ENABLE"
  xlen: [32, 64]
  tier: smoke
  touches: [hw/rtl/cache, sim/simx/amo, sim/simx/mem]
tests:
  # RISC-V 'A' ISA conformance (rv{XLEN}ua-p-{amo*,lrsc}); shares the A-built sim.
  # Single cluster: the A-extended sim is built with this shape (vars thread the
  # same bound the blackbox specs get) so a real shared L1-LLC resolves every
  # AMO — unbounded, the TOML default's per-core private L1s would each act as
  # their own LLC and lose cross-core atomics.
  - id: isa-conformance
    via: make-run
    dir: tests/riscv/isa
    target: "run-{driver}-{xlen}a"
    drivers: [simx, rtlsim]
    vars: {CONFIGS: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_NUM_CLUSTERS=1"}
  # Single-cluster, single-core L1 = LLC. Default config (4 warps x 4 threads
  # = 16 harts). Shape-pinned: without an L2, AMOs resolve at the private
  # per-cluster L1s, so the hammer only has well-defined results when all
  # harts share one cluster's LLC (verified: 8 clusters x 1 core loses ~87%
  # of increments; 1x1 passes all 12 tests).
  - id: base
    app: amo
    drivers: [simx, rtlsim]
    shape: {clusters: 1, cores: 1}
  # Write-back D-cache variants (rtlsim only in the legacy suite). Same
  # single-cluster pinning: the write-back L1 is still the only LLC.
  - id: wb-dirtybytes0
    app: amo
    drivers: [rtlsim]
    shape: {clusters: 1, cores: 1}
    configs+: "-DVX_CFG_DCACHE_WRITEBACK=1 -DVX_CFG_DCACHE_DIRTYBYTES=0 -DVX_CFG_DCACHE_NUM_WAYS=4"
  - id: wb-dirtybytes1
    app: amo
    drivers: [rtlsim]
    shape: {clusters: 1, cores: 1}
    configs+: "-DVX_CFG_DCACHE_WRITEBACK=1 -DVX_CFG_DCACHE_DIRTYBYTES=1 -DVX_CFG_DCACHE_NUM_WAYS=4"
  - id: wb
    app: amo
    drivers: [simx]
    shape: {clusters: 1, cores: 1}
    configs+: "-DVX_CFG_DCACHE_WRITEBACK=1 -DVX_CFG_DCACHE_NUM_WAYS=4"
  # 8 threads, single block — same single-cluster reasoning as base.
  - id: threads8
    app: amo
    drivers: [simx, rtlsim]
    shape: {clusters: 1, cores: 1, threads: 8}
    args: "-n1"
  # Multi-core AMO across a shared cache hierarchy (atomics resolve at the LLC).
  # 4x L1 -> 1x L2 (multi-core base configuration). clusters=1 is required:
  # the shared L2 only exists within one cluster — unbounded, the TOML default's
  # 8 per-cluster L2s have no cross-cluster serialization and lose ~87% of
  # cross-cluster atomic increments (verified: shared=512 of 4096 on CI).
  - id: mc-l2
    app: amo
    drivers: [simx]
    shape: {clusters: 1, cores: 4, l2cache: true}
    args: "-n8"
    tier: full
  # 4x L2 -> 1x L3 (two-level hierarchy). L2 must be write-through above the LLC.
  # Same clusters=1 pinning as mc-l2 for the same reason.
  - id: mc-l3
    app: amo
    drivers: [simx]
    configs+: "-DVX_CFG_L2_WRITEBACK=0"
    shape: {clusters: 1, cores: 4, l2cache: true, l3cache: true}
    args: "-n8"
    tier: full
