  drivers:
  - rtlsim
  app: dxa_copy
  configs: -DVX_CFG_EXT_DXA_ENABLE
  args: -d1
  flags: --debug=3 --perf=6
- id: dxa_copy-7
  via: blackbox
  drivers:
  - rtlsim
  app: dxa_copy
  configs: -DVX_CFG_EXT_DXA_ENABLE
  args: -d2
  flags: --perf=6
- id: dxa_copy-8
  via: blackbox
  drivers:
  - rtlsim
  app: dxa_copy
  configs: -DVX_CFG_EXT_DXA_ENABLE
  shape:
    cores: 2
  args: -d3
- id: dxa_copy-9
  via: blackbox
  drivers:
  - rtlsim
  app: dxa_copy
  configs: -DVX_CFG_EXT_DXA_ENABLE
  args: -d4
- id: dxa_copy-10
  via: blackbox
  drivers:
  - rtlsim
  app: dxa_copy
  configs: -DVX_CFG_EXT_DXA_ENABLE
  args: -d5
- id: dxa_copy-2c2s
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: dxa_copy
  configs: -DVX_CFG_EXT_DXA_ENABLE
  shape:
    clusters: 2
    cores: 2
    l2cache: true
  timeout: 30
  args: -d3
- id: dxa_copy_mcast-1
  via: blackbox
  drivers:
  - simx
  app: dxa_copy_mcast
  configs: -DVX_CFG_EXT_DXA_ENABLE
  # gen-11: HANG reproduced on 7e740129db (probe: `dxa_copy_mcast -r16 -c16
  # -R16 -C4` at the 1x4+DXA default, quiet tree, RC=124 after 60m) — matches
  # the gen-9/10 dxa-cell kills with this case in-flight (>5h49m). Likely the
  # same livelock family as the simx gbar hang. Tracked xfail; the watchdog
  # terminates it so the cell continues.
  timeout: 30
  known_issue: >-
    simx dxa_copy_mcast livelock: never completes at the default 1x4+DXA
    config (reproduced on 7e740129db, RC=124 at 60m); sank the dxa cells in
    gen-9 and gen-10 (runs 37051182787, 37146307766).
- id: dxa_copy_mcast-2
  via: blackbox
  drivers:
  - rtlsim
  app: dxa_copy_mcast
  configs: -DVX_CFG_EXT_DXA_ENABLE
- id: dxa_copy_mcast-3
  via: blackbox
  drivers:
  - simx
  app: dxa_copy_mcast
  configs: -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_L2_ENABLE
  # gen-11: default-args dxa_copy_mcast on simx is the proven livelock (see
  # dxa_copy_mcast-1); the +L2 variant is untested but is the same app+args,
  # so it carries the tracked xfail too (XPASS tolerated).
  timeout: 30
  known_issue: >-
    simx dxa_copy_mcast livelock at default args: same family as
    dxa_copy_mcast-1; +L2 variant untested but same app+args.
- id: dxa_copy_mcast-4
  via: blackbox
  drivers:
  - rtlsim
  app: dxa_copy_mcast
  configs: -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_L2_ENABLE
- id: dxa_copy_mcast-5
