# Test cases for `dxa`, drafted from regression.sh.in (review/collapse).
category: dxa
defaults:
  xlen:
  - 32
  - 64
  tier: smoke
  configs: "-DVX_CFG_EXT_DXA_ENABLE"
  touches: [hw/rtl/dxa, sim/simx/dxa]
  # gen-11: 2-way split (gen-10: the unsharded simx cell hit the 360m cap in
  # both gens — collection order shows dxa_copy_mcast-1 in-flight at kill,
  # >5h49m). Watchdogs below bound any single case at 60m, so the split only
  # has to halve the family weight, not balance it perfectly.
  # gen-11 category-wide watchdog: the gen-9/10 kills mean most legs below
  # never executed in CI, so their runtimes are unmeasured — default-bound
  # every case at 60m (simx mcast legs keep their explicit 30m; measured
  # fast dirs sit 60x under it).
  timeout: 60
  shards: 2
tests:
- id: dxa_copy-1
  via: blackbox
  drivers:
  - simx
  app: dxa_copy
  configs: -DVX_CFG_EXT_DXA_ENABLE
  args: -d1
  # gen-11 watchdog: dxa_copy legs measured 1.5-2m in-cell (gen-10 dxa-32
  # log); 30m is >15x headroom incl. the per-test driver build.
  timeout: 30
  flags: --debug=3 --perf=6
- id: dxa_copy-2
  via: blackbox
  drivers:
  - simx
  app: dxa_copy
  configs: -DVX_CFG_EXT_DXA_ENABLE
  args: -d2
  timeout: 30
  flags: --perf=6
- id: dxa_copy-3
  via: blackbox
  drivers:
  - simx
  app: dxa_copy
  configs: -DVX_CFG_EXT_DXA_ENABLE
  shape:
    cores: 2
  args: -d3
  timeout: 30
- id: dxa_copy-4
  via: blackbox
  drivers:
  - simx
  app: dxa_copy
  configs: -DVX_CFG_EXT_DXA_ENABLE
  args: -d4
  timeout: 30
- id: dxa_copy-5
  via: blackbox
  drivers:
  - simx
  app: dxa_copy
  configs: -DVX_CFG_EXT_DXA_ENABLE
  args: -d5
  timeout: 30
- id: dxa_copy-6
