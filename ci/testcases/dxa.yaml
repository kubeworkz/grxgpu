  - simx
  app: dxa_copy_mcast
  configs: -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_NUM_WARPS=8
  shape:
    threads: 8
  args: -r16 -c16 -R16 -C8
  timeout: 30
  known_issue: >-
    simx dxa_copy_mcast livelock with 8 warps (-r16 -c16 -R16 -C8): CI
    watchdog kill at 30m in run 37243146958; same family as dxa_copy_mcast-1.
