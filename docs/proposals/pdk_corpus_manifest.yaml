# Conformance corpus manifest — attachment to open_pdk_harness_spec.md §2.
#
# A deck cannot be shown equivalent on clean layouts alone: the corpus carries
# positive controls (cases that must be flagged) as well as negative controls
# (cases at or near a limit that must not be flagged). The harness compares the
# violation SETS, so a deck that misses a violation fails as loudly as one that
# invents a violation.
#
# Dispositions:
#   clean     — neither deck may report a violation on this layout
#   violation — both decks must report at least one violation in the named
#               family; the harness records the exact rule IDs and compares
#               the sets rather than trusting the family label
#
# status:
#   exists  — reproducible today from the named artifact
#   planned — case defined, layout not yet drawn; artifact: tbd
#
# The corpus is ours, so it can be published with the harness. Partner-supplied
# layouts join the same manifest with `source: partner` and are not published.

meta:
  version: 1
