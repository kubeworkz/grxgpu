  spec: open_pdk_harness_spec.md
  corpus_root: syn/pdk/corpus
  total_cases: 104
  counts:
    clean: 90
    violation: 14
  note: >-
    The manifest moves under corpus_root when the harness lands; it sits beside
    the proposal until then. Rule families are deck-neutral on purpose: the
    specific rule IDs belong to the foundry deck being validated, and the
    harness records them per run.

