# Runner health — fails when work waits while nothing is running.
#
# A wedged actions worker is invisible from the PR view: every run stays queued,
# cancel requests never apply, and no job is ever attributed to the worker
# holding it. That state cost an afternoon of manual polling once, so it is
# checked here on a schedule instead.
#
# Why the signal is "nothing running" rather than "a busy runner with no job":
# the self-hosted runner inherits the same `ubuntu-22.04` label as the hosted
# pool, so a queued job does not say which of the two it is waiting for, and
# runner inventory (`/actions/runners`) needs repository admin, which the
# workflow token cannot hold. What is left, and what actually distinguishes the
# wedge from an ordinary busy queue, is that dispatch has stopped: jobs sit
# queued past the threshold while zero jobs run anywhere. A merely busy fleet
# always has jobs in progress, so it cannot trip this.
#
# "Running" here means a step is executing. A cell killed by a cancel request
# that never applied keeps reporting in_progress with every step finished, and
# holds a concurrency slot until GitHub reaps it; a fleet of those starves
# dispatch exactly like an idle one and must not read as healthy work.
#
# Known blind spot: if dispatch stops account-wide this job queues too, so the
# check reports the window afterwards rather than during it. It is a
# post-recovery and partial-outage detector, not an in-band alarm.

name: Runner health

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  stalled-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail when jobs wait while nothing runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          API: ${{ github.api_url }}
          WEDGED_MINUTES: "15"
          IDLE_GRACE_MINUTES: "5"
        run: |
          python3 - <<'PYEOF'
          import http.client, json, os, time, urllib.request, urllib.error
          from datetime import datetime, timezone

          api = os.environ["API"].rstrip("/")
          repo = os.environ["GITHUB_REPOSITORY"]
          tok = os.environ["GH_TOKEN"]
          threshold = float(os.environ.get("WEDGED_MINUTES", "15"))
          grace = float(os.environ.get("IDLE_GRACE_MINUTES", "5"))
          self_run = os.environ.get("GITHUB_RUN_ID", "")

          def req(path, attempts=2):
              url = path if path.startswith("http") else api + path
              for attempt in range(1, attempts + 1):
                  r = urllib.request.Request(url)
                  r.add_header("Authorization", "Bearer " + tok)
                  r.add_header("Accept", "application/vnd.github+json")
                  try:
                      with urllib.request.urlopen(r, timeout=15) as resp:
                          return json.loads(resp.read() or b"{}")
                  except urllib.error.HTTPError as e:
                      # 5xx is GitHub's side and is often momentary; 4xx will not
                      # improve with a retry.
                      if e.code < 500 or attempt == attempts:
                          print("runner-health: GET %s -> %s" % (path, e.code))
                          return None
                  except (urllib.error.URLError, http.client.HTTPException, OSError, ValueError) as e:
                      # Truncated bodies arrive as IncompleteRead, and a reset
                      # arrives as OSError; neither is an HTTPError.
                      if attempt == attempts:
                          print("runner-health: GET %s -> %s" % (path, e))
                          return None
                  time.sleep(3)
              return None

          now = datetime.now(timezone.utc)

          def age_minutes(stamp):
              if not stamp or not stamp.endswith("Z"):
                  return 0.0
              return (now - datetime.strptime(stamp, "%Y-%m-%dT%H:%M:%SZ")
                      .replace(tzinfo=timezone.utc)).total_seconds() / 60.0

          # A job is only working while one of its steps runs. Between steps a
          # job has no live step for a second or two, so an idle job still counts
          # as running until it passes the grace window; an unknown timeline is
          # treated as fresh rather than stuck.
          def work_state(job):
              steps = job.get("steps") or []
              if any(s.get("status") == "in_progress" for s in steps):
                  return "running", 0.0
              done = [s.get("completed_at") for s in steps if s.get("completed_at")]
              idle = age_minutes(max(done) if done else job.get("started_at"))
              return ("running" if idle < grace else "zombie"), idle

          # ---- runs that still have work to place ----------------------------
          # Filtered by status and swept to the end: stopping at the first page
          # older than the threshold would miss a long run that started hours
          # ago and is still going, which looks identical to a stall.
          #
          # This run is skipped: its own job is in_progress for the whole scan,
          # so counting it would make "a job is running" true by construction and
          # the stall test unreachable.
          run_meta = {}
          for status in ("in_progress", "queued", "pending", "waiting", "requested"):
              page = 1
              while True:
                  batch = req("/repos/%s/actions/runs?status=%s&per_page=100&page=%d"
                              % (repo, status, page))
                  if batch is None:
                      raise SystemExit(1)
                  rs = batch.get("workflow_runs", [])
                  for r in rs:
                      if self_run and str(r["id"]) == self_run:
                          continue
                      run_meta[r["id"]] = r
                  if len(rs) < 100 or page >= 20:
                      break
                  page += 1

          # ---- where that work actually is -----------------------------------
          # A run whose first job page answers is readable enough to judge: the
          # jobs on it are real, only the tail is missing. A 5xx on page two of a
          # hundred-job matrix is a GitHub-side hiccup, not evidence of a wedge,
          # and treating it as one turns a live matrix into a false alarm. Only a
          # run with no readable page at all is genuinely unknown.
          queued, running, zombie = [], [], []
          unreadable, partial = [], []
          for rid in sorted(run_meta):
              page = 1
              pages_read = 0
              while True:
                  part = req("/repos/%s/actions/runs/%d/jobs?filter=latest&per_page=100&page=%d"
                             % (repo, rid, page))
                  if part is None:
                      if pages_read == 0:
                          unreadable.append(rid)
                      else:
                          partial.append((rid, pages_read))
                          print("::warning::runner-health: run %s job list stopped answering "
                                "after %d page(s); jobs past it are not counted"
                                % (rid, pages_read))
                      break
                  pages_read += 1
                  for j in part.get("jobs", []):
                      j["run_id"] = rid
                      j_status = j.get("status")
                      if j_status == "in_progress":
                          state, idle = work_state(j)
                          if state == "running":
                              running.append(j)
                          else:
                              j["idle_minutes"] = idle
                              zombie.append(j)
                      elif j_status in ("queued", "pending", "waiting", "requested"):
                          queued.append(j)
                  if len(part.get("jobs", [])) < 100:
                      break
                  page += 1

          # A run younger than the threshold proves nothing yet: its job list may
          # still be materialising, and a single 5xx can look the same as a stuck
          # run. Only unreadable runs old enough to be blocking are reported.
          stale_unreadable = [rid for rid in unreadable
                              if age_minutes(run_meta.get(rid, {}).get("created_at")) >= threshold]

          # ---- classify ------------------------------------------------------
          # A busy fleet always has jobs in progress, so running work rules the
          # wedge out regardless of queue depth. Only a queue draining to nothing
          # is a stall.
          stalled = []
          if not running and queued:
              waiting = [j for j in queued
                         if age_minutes(j.get("created_at")) >= threshold]
              if waiting:
                  waiting.sort(key=lambda j: j.get("created_at", ""))
                  stalled = waiting
          zombie.sort(key=lambda j: j["idle_minutes"], reverse=True)

          if not stalled and not stale_unreadable and not zombie:
              print("runner-health: %d job(s) queued, %d running — no stall"
                    % (len(queued), len(running)))
              raise SystemExit(0)

          lines = []
          if stalled:
              oldest = stalled[0]
              lines.append(
                  "no job has started while %d job(s) wait, oldest %.0f min "
                  "(run %s, %s)"
                  % (len(queued), age_minutes(oldest.get("created_at")),
                     oldest.get("run_id"), oldest.get("name")))
              lines.append(
                  "the queue spans %d run(s); oldest waiting job created %s"
                  % (len({j.get("run_id") for j in stalled}), oldest.get("created_at")))
          if zombie:
              worst = zombie[0]
              lines.append(
                  "%d job(s) report in_progress with every step finished, idle up to "
                  "%.0f min (run %s, %s); they hold concurrency without doing work"
                  % (len(zombie), worst["idle_minutes"], worst.get("run_id"), worst.get("name")))
          for rid in stale_unreadable:
              # Unreadable state is reported, never assumed healthy: the runs
              # that wedge a worker are the same ones whose job list stops
              # answering, so silence here would hide exactly what this checks.
              meta = run_meta.get(rid, {})
              lines.append("run %s (%s, %s) has no readable job list after retries; cancel "
                           "or re-run it if it is stuck"
                           % (rid, meta.get("head_branch", "?"), meta.get("status", "?")))

          for line in lines:
              print("::error::" + line)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write("## Runner health\n\n")
                  f.write("\n".join("- " + line for line in lines) + "\n")
                  if stalled:
                      f.write("\nQueued work is not being picked up and no job is running "
                              "anywhere. Restart the actions runner service on the host, then "
                              "cancel the runs stuck in queued: a worker that still reports "
                              "busy with nothing attributed blocks dispatch entirely.\n")
                  if zombie:
                      f.write("\nSome cells report in_progress with no step running. Their "
                              "cancel never applied and they hold a concurrency slot until "
                              "GitHub reaps them; re-send the cancel until the run reaches "
                              "cancelled.\n")
                  if partial:
                      f.write("\n%d run(s) answered only part of their job list; jobs beyond "
                              "the last readable page are excluded from this verdict.\n"
                              % len(partial))
          raise SystemExit(1)
          PYEOF
