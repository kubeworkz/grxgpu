# Synthesis pipeline gate.
#
# Guards the TCU synthesis preprocessing chain (syn/flatten_tcu.py and friends)
# against regressions: the nested-ifdef fix has been silently reverted by
# branch merges twice, and preprocessing bugs previously surfaced only as
# Surelog FATAL/SYNTAX/ERROR during manual synthesis runs.
#
# What it runs: syn/ci_gate.sh
#   Stage 0: flatten_tcu.py --self-test (nested-ifdef invariant)
#   Stage 1: the 6-stage preprocessing pipeline
#   Stage 2: Surelog elaboration via synlig — fails on any non-zero
#            [FATAL]/[SYNTAX]/[ERROR] summary counter or a parse abort.
#
# Tooling: the chipsalliance/synlig release tarball ships a standalone
# `synlig` binary (bundled yosys + techlibs) — no apt yosys or plugin
# installation needed. Verified against the real TCU pipeline output.
#
# Path filter: only synth-affecting changes trigger the full gate. The gate
# degrades to self-test-only when synlig is unavailable (see ci_gate.sh), so
# the workflow still exercises the self-test on unrelated changes.
name: Synth Gate

on:
  push:
    paths:
      - 'syn/flatten_tcu.py'
      - 'syn/preprocess_for_synth.py'
      - 'syn/expand_struct_refs.py'
      - 'syn/fix_tcu_core_interfaces.py'
      - 'syn/inline_all_functions.py'
      - 'syn/synth_fixup.py'
      - 'syn/ci_gate.sh'
      - 'hw/rtl/tcu/**'
      - '.github/workflows/synth-gate.yml'
  pull_request:
    paths:
      - 'syn/flatten_tcu.py'
      - 'syn/preprocess_for_synth.py'
      - 'syn/expand_struct_refs.py'
      - 'syn/fix_tcu_core_interfaces.py'
      - 'syn/inline_all_functions.py'
      - 'syn/synth_fixup.py'
      - 'syn/ci_gate.sh'
      - 'hw/rtl/tcu/**'
      - '.github/workflows/synth-gate.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      # Latest synlig release (standalone binary; bundled yosys + techlibs).
      # Pin: updating this URL is a deliberate act — the elaboration results
      # are only as reproducible as this binary.
      SYNLIG_URL: https://github.com/chipsalliance/synlig/releases/download/2024-12-10-2d838ed/synlig-2d838ed-2024-12-10.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install standalone synlig
        run: |
          set -euo pipefail
          curl -sSfL "$SYNLIG_URL" -o /tmp/synlig.tar.gz
          mkdir -p "$HOME/.local/opt/synlig"
          tar -xzf /tmp/synlig.tar.gz -C "$HOME/.local/opt/synlig" --strip-components=1
          "$HOME/.local/opt/synlig/synlig" --version

      - name: Run synthesis gate
        run: |
          chmod +x syn/ci_gate.sh
          export SYNLIG_BIN="$HOME/.local/opt/synlig/synlig"
          ./syn/ci_gate.sh
